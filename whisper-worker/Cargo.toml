[package]
name = "omarchy-whisper-worker"
version = "0.1.0"
edition = "2024"
description = "Runs the recorder's whisper passes on another machine (Metal on a Mac, Vulkan or CUDA elsewhere)"
license = "MIT"

[dependencies]
serde_json = "1"
tiny_http = "0.12"
whisper-words = { path = "../whisper-words" }
whisper-rs = "0.16"

[features]
default = []
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
